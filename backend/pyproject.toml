[project]
name = "aio-agent-platform"
version = "0.1.0"
description = "A self-evolving multi-tenant AI agent platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AIO Agent Platform Team" },
]
keywords = ["ai", "agent", "llm", "multi-tenant"]

dependencies = [
    # ---- LLM 调用 ----
    "openai>=1.60.0",
    "anthropic>=0.40.0",

    # ---- 认证 ----
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",

    # ---- 数据验证 & 配置 ----
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # ---- 数据库 ----
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",          # SQLAlchemy async 需要
    "typing-extensions>=4.12.0",

    # ---- 文本检索 ----
    "rjieba>=0.2.0",

    # ---- Web 框架 ----
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",  # FastAPI 文件上传
    "itsdangerous>=2.2.0",        # JWT secret 安全签名

    # ---- HTTP ----
    "httpx>=0.28.0",

    # ---- 模板 ----
    "jinja2>=3.1.0",

    # ---- 任务调度 ----
    "apscheduler>=3.11.0",

    # ---- CLI ----
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.48",

    # ---- 沙盒 ----
    "docker>=7.1.0",

    # ---- 对象存储 ----
    "minio>=7.2.0",

    # ---- 日志 ----
    "structlog>=24.4.0",

    # ---- 工具 ----
    "python-dotenv>=1.0.0",
    "email-validator>=2.2.0",
    "Pillow>=10.0.0",              # 图片压缩 (chat attachments)

    # ---- 可观测性 ----
    "langfuse>=4.0.0",
]

[project.optional-dependencies]
vector = ["chromadb>=0.6.0"]
browser = ["playwright>=1.49.0"]
mcp = ["mcp>=1.0.0"]
filewatch = ["watchdog>=6.0.0"]
all = [
    "chromadb>=0.6.0",
    "playwright>=1.49.0",
    "mcp>=1.0.0",
    "watchdog>=6.0.0",
]

[project.scripts]
aio-agent = "aio_agent_platform.interface.cli:main"
aio-api = "aio_agent_platform.interface.api:run"
aio-manage = "aio_agent_platform.manage:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aio_agent_platform"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
