<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g1)"/>
  <!-- AI sparkle -->
  <g transform="translate(16,16)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central diamond -->
    <polygon points="0,-7 4,0 0,7 -4,0" fill="#fff" fill-opacity="0.15"/>
    <!-- Top-left spark -->
    <line x1="-11" y1="-11" x2="-5" y2="-5"/>
    <line x1="-11" y1="-11" x2="-13.5" y2="-11"/>
    <line x1="-11" y1="-11" x2="-11" y2="-13.5"/>
    <!-- Top-right spark -->
    <line x1="11" y1="-11" x2="5" y2="-5"/>
    <line x1="11" y1="-11" x2="13.5" y2="-11"/>
    <line x1="11" y1="-11" x2="11" y2="-13.5"/>
    <!-- Bottom-left spark -->
    <line x1="-11" y1="11" x2="-5" y2="5"/>
    <line x1="-11" y1="11" x2="-13.5" y2="11"/>
    <line x1="-11" y1="11" x2="-11" y2="13.5"/>
    <!-- Bottom-right spark -->
    <line x1="11" y1="11" x2="5" y2="5"/>
    <line x1="11" y1="11" x2="13.5" y2="11"/>
    <line x1="11" y1="11" x2="11" y2="13.5"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="1.5" fill="#fff" stroke="none"/>
  </g>
</svg>
